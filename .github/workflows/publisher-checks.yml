name: Store publisher checks
on:
  push:
    paths: ['scripts/**', 'games.json', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'games.json', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
