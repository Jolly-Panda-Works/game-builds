name: Build private Android games
on:
  workflow_dispatch:
    inputs:
      game:
        description: Registered game id, or all
        type: string
        default: all
      bump:
        type: choice
        default: patch
        options: [patch, minor, major]
      rebuild:
        description: Build a new version even if the source revision already has a release
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: [games.json, 'scripts/build-*.mjs', scripts/resolve-build.mjs, '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.plan.outputs.games }}
      has_games: ${{ steps.plan.outputs.has_games }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GAME: ${{ inputs.game || 'all' }}
        run: node scripts/build-plan.mjs
  build:
    needs: plan
    if: needs.plan.outputs.has_games == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ matrix.game.id }}
    permissions:
      contents: read
    concurrency:
      group: game-${{ matrix.game.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.games) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPOSITORY: ${{ matrix.game.repository }}
      SOURCE_BRANCH: ${{ matrix.game.branch }}
      GAME_ID: ${{ matrix.game.id }}
      PUBLISH_STORES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create token scoped to this game only
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BUILD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
          owner: Jolly-Panda-Works
          repositories: ${{ matrix.game.repositoryName }}
          permission-contents: write
      - name: Read private game using the GitHub App
        id: source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.game.repository }}
          ref: ${{ matrix.game.branch }}
          path: source
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate private release credentials before building
        id: access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api "repos/$SOURCE_REPOSITORY" --silent
      - name: Resolve version and skip already published source
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          REBUILD: ${{ inputs.rebuild || false }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/resolve-build.mjs
      - uses: actions/setup-java@v4
        if: steps.version.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.build == 'true'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.build == 'true'
      - name: Install and test
        id: test
        if: steps.version.outputs.build == 'true'
        working-directory: source
        run: |
          if [ -f package.json ]; then npm ci && npm test --if-present; fi
      - name: Build Android wrapper for registered web games
        id: web
        if: steps.version.outputs.build == 'true' && matrix.game.builder == 'web'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-web-android.mjs
      - name: Build store APKs and optional web archive; never submit to stores
        id: native
        if: steps.version.outputs.build == 'true' && matrix.game.builder != 'web'
        working-directory: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAZAAR_RSA_KEY: ${{ vars.BAZAAR_RSA_KEY }}
          MYKET_PUBLIC_KEY: ${{ vars.MYKET_PUBLIC_KEY }}
          BAZAAR_DEVELOPER_ID: ${{ vars.BAZAAR_DEVELOPER_ID }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || vars.GAME_SERVER_URL || '' }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || '' }}
          BUILD_EDITIONS: ${{ steps.version.outputs.stores }}
        run: |
          mapfile -t STORES < <(node -e 'for(const s of JSON.parse(process.env.BUILD_EDITIONS)) console.log(s)')
          for STORE in "${STORES[@]}"; do
            export STORE
            if [ "$STORE" != debug ]; then
              for KEY in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
                if [ -z "${!KEY}" ]; then echo "::error::Missing original release signing secret: $KEY in environment $GAME_ID"; exit 1; fi
              done
            fi
            # Isolate each store's native dependencies and key resources.
            if node -e 'process.exit(require("./game.config.json").nativeProject === "committed" ? 1 : 0)'; then rm -rf android; fi
            npm run build:android
          done
      - name: Verify installable package and signatures
        id: verify
        if: steps.version.outputs.build == 'true'
        working-directory: source
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          APP_ID=$(node -p 'require("./game.config.json").appId')
          shopt -s nullglob
          APKS=(out/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then echo '::error::Build produced no APK'; exit 1; fi
          for APK in "${APKS[@]}"; do
            EXPECTED_ID="$APP_ID"
            if [[ "$APK" == *-debug.apk ]]; then EXPECTED_ID="$APP_ID.debug"; fi
            "$SIGNER" verify "$APK"
            "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
            grep -F "package: name='$EXPECTED_ID'" "$RUNNER_TEMP/badging.txt"
            grep -F 'launchable-activity:' "$RUNNER_TEMP/badging.txt"
            if [[ "$APK" == *-debug.apk ]]; then grep -F 'application-debuggable' "$RUNNER_TEMP/badging.txt"; fi
          done
      - name: Prepare owner-reviewable store manifest (no upload to stores)
        id: manifest
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/create-publication.mjs --game "$GAME_ID" --source source --out source/out --version "$VERSION"
      - name: Tag exact private source after successful builds
        id: tag
        if: steps.version.outputs.build == 'true'
        working-directory: source
        env:
          SOURCE_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          if ! git rev-parse "$SOURCE_TAG" >/dev/null 2>&1; then git tag "$SOURCE_TAG" "$SOURCE_SHA"; fi
          git push "https://github.com/$SOURCE_REPOSITORY.git" "refs/tags/$SOURCE_TAG"
      - name: Publish binaries in the private game's releases
        id: publish
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE: ${{ steps.version.outputs.release }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh release create "$RELEASE" source/out/* --repo "$SOURCE_REPOSITORY" --verify-tag --title "$RELEASE" --notes "Android builds of $GAME_ID from $SOURCE_BRANCH at $SOURCE_SHA. Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No store API was called."
          echo "Release: https://github.com/$SOURCE_REPOSITORY/releases/tag/$RELEASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Report game status and authenticated download links
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUILD_STEPS: ${{ toJSON(steps) }}
          BUILD_REQUIRED: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: node scripts/build-report.mjs
      - name: Save game report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.game.id }}
          path: reports/${{ matrix.game.id }}.json
          retention-days: 14
  summary:
    name: All games - status and downloads
    needs: [plan, build]
    if: always() && needs.plan.outputs.has_games == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-report-*
          path: reports
          merge-multiple: true
      - name: Summarize every selected game
        env:
          SELECTED_GAMES: ${{ needs.plan.outputs.games }}
        run: |
          mkdir -p reports
          node scripts/build-report.mjs --aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: all-games-status
          path: reports/all-games.json
          retention-days: 14
